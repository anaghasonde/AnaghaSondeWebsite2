<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#F0F0F0"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="50%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#8E1515"/>
    </linearGradient>
    <filter id="bookShadow" x="-10%" y="-5%" width="125%" height="115%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#111111" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Book Base Background -->
  <rect x="15" y="15" width="370" height="570" rx="6" fill="url(#bgGrad)" stroke="#C62828" stroke-width="1.5" filter="url(#bookShadow)" />
  
  <!-- Subtle Spine Shadow -->
  <rect x="15" y="15" width="16" height="570" rx="3" fill="#000000" opacity="0.08" />
  <line x1="31" y1="15" x2="31" y2="585" stroke="#C62828" stroke-width="0.8" opacity="0.3"/>

  <!-- Outer Framing Motif -->
  <rect x="42" y="40" width="316" height="520" rx="2" fill="none" stroke="#111111" stroke-width="0.75" opacity="0.4"/>
  <rect x="48" y="46" width="304" height="508" rx="2" fill="none" stroke="#C62828" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Top Category / Genre -->
  <text x="200" y="95" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#666666" text-anchor="middle">A PERSONAL MEMOIR</text>
  
  <!-- Subtle Red Divider -->
  <line x1="160" y1="115" x2="240" y2="115" stroke="url(#redAccent)" stroke-width="1.5"/>
  <circle cx="200" cy="115" r="2.5" fill="#C62828" />

  <!-- Book Title -->
  <text x="200" y="210" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0.5">Welcome</text>
  <text x="200" y="255" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0.5">Back to</text>
  <text x="200" y="300" font-family="'Playfair Display', Georgia, serif" font-size="34" font-style="italic" font-weight="700" fill="#C62828" text-anchor="middle" letter-spacing="1">Yourself</text>

  <!-- Delicate Red Line -->
  <line x1="120" y1="335" x2="280" y2="335" stroke="url(#redAccent)" stroke-width="1.2"/>

  <!-- Tagline / Subtitle -->
  <text x="200" y="375" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-style="italic" fill="#444444" text-anchor="middle">Sometimes, the most meaningful journey</text>
  <text x="200" y="398" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-style="italic" fill="#444444" text-anchor="middle">is the one that brings you back</text>
  <text x="200" y="421" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-style="italic" fill="#444444" text-anchor="middle">to who you are.</text>

  <!-- Embroidered Lotus / Sun Emblem -->
  <g transform="translate(200, 470) scale(0.75)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#C62828" stroke-width="0.8" opacity="0.6"/>
    <circle cx="0" cy="0" r="2" fill="#C62828"/>
    <path d="M 0,-14 Q 7,-5 0,0 Q -7,-5 0,-14 Z" fill="#C62828" opacity="0.8"/>
    <path d="M 0,14 Q 7,5 0,0 Q -7,5 0,14 Z" fill="#C62828" opacity="0.8"/>
    <path d="M -14,0 Q -5,7 0,0 Q -5,-7 -14,0 Z" fill="#C62828" opacity="0.8"/>
    <path d="M 14,0 Q 5,7 0,0 Q 5,-7 14,0 Z" fill="#C62828" opacity="0.8"/>
  </g>

  <!-- Author Name -->
  <text x="200" y="525" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#111111" text-anchor="middle">ANAGHA SONDE</text>
  <text x="200" y="542" font-family="'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="2" fill="#C62828" text-anchor="middle">FOUNDER OF MIND MATTERS</text>
</svg>
